<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
</head>
<body>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const isAndroid = /Android/i.test(navigator.userAgent);

    if (id) {
      fetch("links.json?v=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error("File JSON tidak ditemukan (" + r.status + ")");
          return r.json();
        })
        .then(data => {
          const item = data[id.trim()];
          if (!item || (!item.url && !item.place_id)) {
            document.body.innerText = "Tag #" + id + " belum diaktifkan.";
            return;
          }

          if (isAndroid && item.place_id) {
            const fallback = encodeURIComponent(item.url || "https://search.google.com/local/writereview?placeid=" + item.place_id);
            const intentUrl = "intent://www.google.com/maps/search/?api=1&query=Google&query_place_id=" + item.place_id + "#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" + fallback + ";end";
            window.location.replace(intentUrl);
          } else {
            window.location.replace(item.url || "https://search.google.com/local/writereview?placeid=" + item.place_id);
          }
        })
        .catch(err => {
          document.body.innerText = "Error: " + err.message;
        });
    }
  </script>
</body>
</html>
