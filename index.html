<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com" crossorigin>

  <style>
    /* Memuat Product Sans / Google Sans langsung dari server Google */
    @font-face {
      font-family: 'Product Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/productsans/v19/pxiDypQkot1TnFhsFMOfGShVF9eO.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Product Sans';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/productsans/v19/pxicypQkot1TnFhsFMOfGShdrPKbTv0.woff2) format('woff2');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: 'Product Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #202124;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Google 4-Color Material Spinner */
    .google-spinner {
      width: 36px;
      height: 36px;
      animation: rotate 1.8s linear infinite;
      margin-bottom: 20px;
    }
    .google-spinner circle {
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      animation: dash 1.4s ease-in-out infinite, colors 5.6s ease-in-out infinite;
      stroke-linecap: round;
    }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
    @keyframes dash {
      0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 89, 200; stroke-dashoffset: -35px; }
      100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124px; }
    }
    @keyframes colors {
      0%, 100% { stroke: #4285F4; }
      25% { stroke: #EA4335; }
      50% { stroke: #FBBC05; }
      75% { stroke: #34A853; }
    }
    .msg {
      font-family: 'Product Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #202124;
      letter-spacing: -0.01em;
    }
    .sub {
      font-family: 'Product Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #5F6368;
      margin-top: 6px;
    }
  </style>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSRuWZe-oOfUy1tvXEFuo122QlNLs_f46vjM6VCYPLgAzsi9K0sU5WLGl2IW3gcvocYZBgX_dqCcFC7/pub?gid=0&single=true&output=csv";
    const tagId = new URLSearchParams(window.location.search).get("id")?.trim();
    const CACHE_KEY = "tap_link_" + tagId;

    const cachedUrl = tagId ? localStorage.getItem(CACHE_KEY) : null;
    if (cachedUrl && cachedUrl.startsWith("http")) {
      window.location.replace(cachedUrl);
    }

    function parseCSVRow(row) {
      const result = [];
      let current = "", inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ""; }
        else current += char;
      }
      result.push(current.trim());
      return result;
    }

    function showError(title, subtitle) {
      const render = () => {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = title;
        document.getElementById("subtext").textContent = subtitle;
      };
      document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", render) : render();
    }

    (async function syncAndRedirect() {
      if (!tagId) {
        showError("ID Tag Tidak Valid", "Silakan tap ulang pada plakat.");
        return;
      }

      try {
        const res = await fetch(SHEET_CSV_URL);
        const csvText = await res.text();
        const lines = csvText.split(/\r?\n/);

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = parseCSVRow(lines[i]);
          if (cols[0] === tagId) {
            const targetUrl = cols[2];
            if (targetUrl && targetUrl.startsWith("http")) {
              localStorage.setItem(CACHE_KEY, targetUrl);
              if (!cachedUrl) window.location.replace(targetUrl);
              return;
            } else {
              localStorage.removeItem(CACHE_KEY);
              if (!cachedUrl) showError("Tag #" + tagId + " Belum Diaktifkan", "Hubungi pemilik tempat untuk mengaktifkan tag ini.");
              return;
            }
          }
        }
        if (!cachedUrl) showError("ID #" + tagId + " Tidak Ditemukan", "Pastikan kode tag sudah terdaftar.");
      } catch (e) {
        if (!cachedUrl) showError("Gagal Memuat Koneksi", "Periksa koneksi internet Anda lalu coba lagi.");
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <svg class="google-spinner" id="spinner" viewBox="25 25 50 50">
      <circle cx="50" cy="50" r="20" fill="none" stroke-width="4" stroke-miterlimit="10"/>
    </svg>
    <div class="msg" id="status">Mengarahkan ke Google Review...</div>
    <div class="sub" id="subtext">Mohon tunggu sebentar</div>
  </div>
</body>
</html>
