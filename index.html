<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    if (id) {
      fetch("links.json?v=" + Date.now())
        .then(r => r.json())
        .then(data => {
          const url = data[id.trim()];
          if (url && url.startsWith("http")) {
            window.location.replace(url);
          } else {
            document.body.innerText = "Tag #" + id + " belum diaktifkan.";
          }
        })
        .catch(() => document.body.innerText = "Koneksi bermasalah.");
    }
  </script>
</head>
<body></body>
</html>
